<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIO BEASTS - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#020808;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#0f1f1f;border:1px solid #1a3333;width:92%;max-width:360px;padding:22px;border-radius:20px;text-align:center}
.logo{font-size:28px;font-weight:900;color:#14B8A6}.sub{font-size:12px;color:#888;margin:6px 0 18px}
.inp{width:100%;background:#0a1515;border:1px solid #1e3333;padding:12px;border-radius:12px;color:#fff;margin:7px 0;outline:none}
.btn{width:100%;background:#14B8A6;color:#000;padding:12px;border-radius:12px;font-weight:900;border:none;margin-top:12px;cursor:pointer}
.gbtn{width:100%;background:#fff;color:#000;padding:12px;border-radius:12px;font-weight:700;border:none;margin-top:10px;display:flex;justify-content:center;gap:8px;align-items:center;cursor:pointer}
.div{margin:14px 0;color:#555;font-size:12px}
.dash{display:none;width:92%;max-width:500px}
.card{background:#101818;border:1px solid #1e3333;border-radius:16px;padding:14px;margin:10px 0}
</style>
</head>
<body>
<div class="box" id="loginBox">
<div class="logo">🧬 BIO BEASTS</div><div class="sub">By Ankur Sir | NEET 2026 Login</div>
<input class="inp" id="email" placeholder="📧 Email - test@bio.com">
<input class="inp" id="pass" type="password" placeholder="🔒 Password - 123456">
<button class="btn" onclick="login()">Login & Continue →</button>
<div class="div">— OR —</div>
<button class="gbtn" onclick="login()">🔵 Continue with Google</button>
<p style="font-size:11px;color:#666;margin-top:12px">Demo: koi bhi email/pass dalo, login ho jayega</p>
</div>

<div class="dash" id="dash">
<h2 style="color:#14B8A6;text-align:center">Welcome Beast! 🔥</h2>
<p style="text-align:center;color:#888;font-size:12px;margin:6px 0 14px">Login Successful</p>
<div class="card"><h3>🌱 Ch-1: Sexual Reproduction</h3><a style="color:#14B8A6" href="#">Open Notes →</a></div>
<div class="card"><h3>🧬 Ch-2: Molecular Basis</h3><a style="color:#14B8A6" href="#">Open Notes →</a></div>
<div class="card"><h3>🏆 Test Series</h3><a style="color:#14B8A6" href="#">Start Test →</a></div>
<button class="btn" style="background:transparent;border:1px solid #333;color:#888" onclick="logout()">Logout</button>
</div>

<script>
function login(){
 if(document.getElementById('email').value==""){alert("Email likho");return}
 document.getElementById('loginBox').style.display='none';
 document.getElementById('dash').style.display='block';
}
function logout(){
 document.getElementById('dash').style.display='none';
 document.getElementById('loginBox').style.display='block';
}
</script>
</body>
</html>
